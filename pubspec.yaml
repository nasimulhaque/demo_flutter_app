name: demo_flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Permissions
  permission_handler: ^12.0.1

  # Sensors
  sensors_plus: ^7.0.0
  pedometer: ^4.0.1

  # Camera & Image
  image_picker: ^1.0.5
  camera: ^0.12.0+1

  # Device Info & Connectivity
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.1.1

  # File handling
  path_provider: ^2.1.1
  path: ^1.9.0

  # UI
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  get: ^4.6.6
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true
  assets:
   - assets/images/